<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360">
    <rect width="900" height="360" fill="#f5f3ec" rx="6" />

    <!-- Panel 1: Footnotes -->
    <g transform="translate(36, 28)">
        <rect width="252" height="304" fill="#ffffff" stroke="#d5cfc0" stroke-width="1.5" rx="4" />
        <text x="126" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#222222">Footnotes</text>
        <line x1="20" y1="38" x2="232" y2="38" stroke="#e5e0d4" stroke-width="1" />

        <!-- Body text lines -->
        <rect x="24" y="54" width="196" height="6" rx="2" fill="#b8b3a6" />
        <rect x="24" y="68" width="142" height="6" rx="2" fill="#b8b3a6" />
        <circle cx="174" cy="70" r="4" fill="#9a3412" />
        <rect x="184" y="68" width="40" height="6" rx="2" fill="#b8b3a6" />
        <rect x="24" y="82" width="188" height="6" rx="2" fill="#b8b3a6" />
        <rect x="24" y="96" width="160" height="6" rx="2" fill="#b8b3a6" />

        <rect x="24" y="122" width="204" height="6" rx="2" fill="#b8b3a6" />
        <rect x="24" y="136" width="94" height="6" rx="2" fill="#b8b3a6" />
        <circle cx="126" cy="138" r="4" fill="#9a3412" />
        <rect x="136" y="136" width="84" height="6" rx="2" fill="#b8b3a6" />
        <rect x="24" y="150" width="176" height="6" rx="2" fill="#b8b3a6" />

        <!-- Footnote rule + notes at bottom -->
        <line x1="24" y1="228" x2="96" y2="228" stroke="#9a3412" stroke-width="1.5" />
        <circle cx="28" cy="246" r="3.5" fill="#9a3412" />
        <rect x="38" y="243" width="182" height="5" rx="2" fill="#6f6a5e" />
        <rect x="38" y="254" width="140" height="5" rx="2" fill="#6f6a5e" />

        <circle cx="28" cy="272" r="3.5" fill="#9a3412" />
        <rect x="38" y="269" width="172" height="5" rx="2" fill="#6f6a5e" />
        <rect x="38" y="280" width="110" height="5" rx="2" fill="#6f6a5e" />
    </g>

    <!-- Panel 2: Endnotes -->
    <g transform="translate(324, 28)">
        <rect width="252" height="304" fill="#ffffff" stroke="#d5cfc0" stroke-width="1.5" rx="4" />
        <text x="126" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#222222">Endnotes</text>
        <line x1="20" y1="38" x2="232" y2="38" stroke="#e5e0d4" stroke-width="1" />

        <!-- Page 1 body -->
        <rect x="24" y="54" width="196" height="6" rx="2" fill="#b8b3a6" />
        <rect x="24" y="68" width="132" height="6" rx="2" fill="#b8b3a6" />
        <circle cx="164" cy="70" r="4" fill="#9a3412" />
        <rect x="174" y="68" width="50" height="6" rx="2" fill="#b8b3a6" />
        <rect x="24" y="82" width="184" height="6" rx="2" fill="#b8b3a6" />
        <rect x="24" y="96" width="204" height="6" rx="2" fill="#b8b3a6" />
        <rect x="24" y="110" width="168" height="6" rx="2" fill="#b8b3a6" />

        <!-- Break between pages -->
        <line x1="24" y1="138" x2="228" y2="138" stroke="#d5cfc0" stroke-width="1" stroke-dasharray="4 4" />
        <text x="126" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7a7467">End of document</text>

        <!-- Endnotes section -->
        <circle cx="28" cy="180" r="3.5" fill="#9a3412" />
        <rect x="38" y="177" width="182" height="5" rx="2" fill="#6f6a5e" />
        <rect x="38" y="188" width="156" height="5" rx="2" fill="#6f6a5e" />

        <circle cx="28" cy="208" r="3.5" fill="#9a3412" />
        <rect x="38" y="205" width="170" height="5" rx="2" fill="#6f6a5e" />
        <rect x="38" y="216" width="124" height="5" rx="2" fill="#6f6a5e" />

        <circle cx="28" cy="236" r="3.5" fill="#9a3412" />
        <rect x="38" y="233" width="186" height="5" rx="2" fill="#6f6a5e" />
    </g>

    <!-- Panel 3: Sidenotes -->
    <g transform="translate(612, 28)">
