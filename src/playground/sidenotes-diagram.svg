        <rect x="20" y="68" width="88" height="6" rx="2" fill="#b8b3a6" />
        <circle cx="115" cy="70" r="4" fill="#2563eb" />
        <rect x="124" y="68" width="24" height="6" rx="2" fill="#b8b3a6" />
        <rect x="20" y="82" width="122" height="6" rx="2" fill="#b8b3a6" />
        <rect x="20" y="96" width="110" height="6" rx="2" fill="#b8b3a6" />

        <!-- Sidenote 1 in margin -->
        <circle cx="164" cy="70" r="3.5" fill="#2563eb" />
        <rect x="172" y="68" width="60" height="5" rx="2" fill="#4f6d9a" />
        <rect x="172" y="79" width="52" height="5" rx="2" fill="#4f6d9a" />
        <rect x="172" y="90" width="58" height="5" rx="2" fill="#4f6d9a" />

        <!-- Second paragraph + sidenote 2 -->
        <rect x="20" y="130" width="128" height="6" rx="2" fill="#b8b3a6" />
        <rect x="20" y="144" width="100" height="6" rx="2" fill="#b8b3a6" />
        <circle cx="127" cy="146" r="4" fill="#2563eb" />
        <rect x="136" y="144" width="12" height="6" rx="2" fill="#b8b3a6" />
        <rect x="20" y="158" width="126" height="6" rx="2" fill="#b8b3a6" />
        <rect x="20" y="172" width="96" height="6" rx="2" fill="#b8b3a6" />

        <circle cx="164" cy="146" r="3.5" fill="#2563eb" />
        <rect x="172" y="144" width="60" height="5" rx="2" fill="#4f6d9a" />
        <rect x="172" y="155" width="46" height="5" rx="2" fill="#4f6d9a" />
        <rect x="172" y="166" width="56" height="5" rx="2" fill="#4f6d9a" />

        <!-- Third paragraph -->
        <rect x="20" y="206" width="124" height="6" rx="2" fill="#b8b3a6" />
        <rect x="20" y="220" width="128" height="6" rx="2" fill="#b8b3a6" />
        <rect x="20" y="234" width="114" height="6" rx="2" fill="#b8b3a6" />
        <rect x="20" y="248" width="90" height="6" rx="2" fill="#b8b3a6" />
    </g>
</svg>
